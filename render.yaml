services:
  # 1. Express API Node.js Web Service
  - type: web
    name: welfare-scheme-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: welfare-scheme-ml
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: welfare-scheme-frontend
          property: host

  # 2. Python FastAPI ML Microservice
  - type: web
    name: welfare-scheme-ml
    runtime: python
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: welfare-scheme-frontend
          property: host
      - key: CORS_ORIGINS
        value: https://welfare-scheme-frontend.onrender.com,https://welfare-scheme-api.onrender.com

  # 3. React / Vite Static Site Frontend
  - type: web
    name: welfare-scheme-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: welfare-scheme-api
          property: host
