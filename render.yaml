services:
  # Node.js Express Backend Web Service
  - type: web
    name: welfare-scheme-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: welfare-scheme-db
          property: connectionString
      - key: PYTHON_ML_URL
        fromService:
          type: web
          name: welfare-scheme-ml
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: welfare-scheme-frontend
          property: host
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: welfare-scheme-frontend
          property: host

  # Python FastAPI ML Microservice
  - type: web
    name: welfare-scheme-ml
    runtime: python
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: welfare-scheme-frontend
          property: host
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: welfare-scheme-frontend
          property: host

  # React / Vite Static Site Frontend
  - type: web
    name: welfare-scheme-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: welfare-scheme-backend
          property: host

databases:
  # Render Managed PostgreSQL Database
  - name: welfare-scheme-db
    databaseName: welfare_db
    user: welfare_user
    plan: free
